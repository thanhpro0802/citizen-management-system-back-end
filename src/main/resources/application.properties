spring.application.name=citizen-management-system-back-end

# 1. Cau hinh JWT (Quan trong cho phan Auth ban dang lam)
citizen.app.jwtSecret=${JWT_SECRET}
citizen.app.jwtExpirationMs=86400000

# 2. Cau hinh PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
